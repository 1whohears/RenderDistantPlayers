modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${issue_tracker}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
logoFile= "../${mod_id}.png"
authors="${mod_authors}"
displayTest="MATCH_VERSION"
description='''${mod_description}'''

[[mixins]]
config = "${mod_id}.common.mixins.json"

[[dependencies."${mod_id}"]] #optional
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="onewholibs"
mandatory=true
versionRange="[${onewholibs_version},)"
ordering="NONE"
side="BOTH"
